[package]
name = "cloud-tariffs-native"
version = "1.0.0"
description = "Guest cloud tariff catalog with local CLIP search"
authors = ["Boris Ivanov"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "cloud_tariffs_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2.9.0"
