services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_TARGET: http://host.docker.internal:8080
      S3_TARGET: http://host.docker.internal:9000
      S3_SIGNED_HOST: localhost:9000
    volumes:
      - .:/app:Z
      - frontend_node_modules:/app/node_modules
    command: npm run dev
volumes:
  frontend_node_modules:
