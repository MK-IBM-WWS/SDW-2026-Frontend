services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # :Z allows this bind mount with Fedora SELinux enabled.
      - .:/app:Z
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  frontend_node_modules:
