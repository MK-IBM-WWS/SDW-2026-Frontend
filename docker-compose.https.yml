services:
  frontend:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_TARGET: http://host.docker.internal:8080
      S3_TARGET: http://host.docker.internal:9000
      S3_SIGNED_HOST: localhost:9000
    volumes:
      - ./certs:/app/certs:ro,Z
